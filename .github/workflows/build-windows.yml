name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare package metadata for pkg
        shell: bash
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.bin='server.js';p.pkg=p.pkg||{};p.pkg.assets=['index.html','styles.css','src/**/*','scripts/**/*','analyze_audio.py','requirements.txt'];fs.writeFileSync('package.json', JSON.stringify(p,null,2));"

      - name: Install pkg globally
        run: npm install -g pkg

      - name: Build Windows executable
        shell: bash
        run: |
          mkdir -p dist
          pkg . \
            --targets node18-win-x64 \
            --output dist/DemucsSeperater.exe

      - name: Prepare runtime assets
        shell: bash
        run: |
          mkdir -p dist/assets
          cp index.html dist/assets/
          cp styles.css dist/assets/
          cp analyze_audio.py dist/assets/
          cp requirements.txt dist/assets/
          cp -r src dist/assets/src
          cp -r scripts dist/assets/scripts
          cp packaging/windows/DemucsSeperater-Launcher.cmd dist/
          cp packaging/windows/DemucsSeperater-Launcher.vbs dist/

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          powershell -Command "Compress-Archive -Path DemucsSeperater.exe,DemucsSeperater-Launcher.cmd,DemucsSeperater-Launcher.vbs,assets -DestinationPath DemucsSeperater-windows-x64.zip -Force"

      - name: Build installer with Inno Setup
        run: choco install innosetup -y

      - name: Compile Setup.exe
        run: iscc /DMyAppVersion=${{ github.ref_name }} build\\windows-installer.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemucsSeperater-windows-x64
          path: dist/DemucsSeperater-windows-x64.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemucsSeperater-Setup-x64
          path: dist/DemucsSeperater-Setup-x64.exe
