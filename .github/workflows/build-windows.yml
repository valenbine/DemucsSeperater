name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install build tools globally
        run: npm install -g pkg esbuild

      - name: Bundle server entrypoint
        shell: bash
        run: |
          mkdir -p dist/pkg
          esbuild server.js \
            --bundle \
            --platform=node \
            --format=cjs \
            --target=node18 \
            --outfile=dist/pkg/server.cjs

      - name: Build Windows executable
        shell: bash
        run: |
          mkdir -p dist
          pkg dist/pkg/server.cjs \
            --targets node18-win-x64 \
            --output dist/DemucsSeperater.exe

      - name: Prepare runtime assets
        shell: bash
        run: |
          mkdir -p dist/assets
          cp index.html dist/assets/
          cp styles.css dist/assets/
          cp analyze_audio.py dist/assets/
          cp requirements.txt dist/assets/
          cp -r src dist/assets/src
          cp -r scripts dist/assets/scripts
          cp packaging/windows/DemucsSeperater-Launcher.cmd dist/
          cp packaging/windows/DemucsSeperater-Launcher.vbs dist/

      - name: Package artifact
        shell: bash
        run: |
          cd dist
          powershell -Command "Compress-Archive -Path DemucsSeperater.exe,DemucsSeperater-Launcher.cmd,DemucsSeperater-Launcher.vbs,assets -DestinationPath DemucsSeperater-windows-x64.zip -Force"

      - name: Build installer with Inno Setup
        run: choco install innosetup -y

      - name: Compile Setup.exe
        run: iscc /DMyAppVersion=${{ github.ref_name }} build\\windows-installer.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemucsSeperater-windows-x64
          path: dist/DemucsSeperater-windows-x64.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemucsSeperater-Setup-x64
          path: dist/DemucsSeperater-Setup-x64.exe
